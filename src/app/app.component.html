<div class="min-vh-100 d-flex flex-column" style="background-color: var(--stoosh-bg-primary);">
  
  <!-- Persistent video background – lives outside @if so it never unmounts -->
  <video class="login-video-bg" [class.login-video-bg--hidden]="!showVideoBg()" autoplay muted loop playsinline preload="auto" disablePictureInPicture aria-hidden="true" tabindex="-1">
    <source src="bg-waves.mp4" type="video/mp4">
    <track kind="captions" src="bg-waves-captions.vtt" srclang="en" label="English" default>
  </video>
  @if (isLoading()) {
    <div class="d-flex flex-column align-items-center justify-content-center min-vh-100">
      
      <div class="d-flex flex-column align-items-center text-white mb-4">
        <i class="bi bi-wallet2 text-burnt-orange mb-2" style="font-size: 2.5rem;"></i>
        <h1 class="text-center m-0 brand-identity tracking-identity">STOO$H</h1>
        <p class="text-secondary small text-center mt-1">Personal Wealth Tracker</p>
      </div>
      
      <output class="spinner-border text-burnt-orange" style="width: 2rem; height: 2rem; border-width: 0.22em;">
        <span class="visually-hidden">Loading...</span>
      </output>
      
    </div>
  } @else {
    <router-outlet></router-outlet>
  }
</div>
