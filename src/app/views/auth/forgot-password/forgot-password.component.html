<h4 class="text-white mb-4 fw-medium tracking-identity w-100 text-start">Reset Password</h4>

<form (submit)="$event.preventDefault(); handleAuthSubmit()" class="w-100 d-flex flex-column gap-3">
  <p class="text-secondary small mb-2">
    Enter the email address associated with your account and we'll send you instructions to safely reset your credentials.
  </p>

  <div class="form-group">
    <label for="email-forgot" class="text-secondary small mb-1">Email Address</label>
    <input type="email" id="email-forgot" name="email" class="form-control stoosh-input" placeholder="name@example.com" required>
  </div>

  <button type="submit" class="stoosh-btn stoosh-btn-primary action-btn w-100 mt-3 py-2_5">
    Send Recovery Email
  </button>

  <div class="text-center mt-3">
    <a routerLink="/auth/log-in" class="text-secondary small link-hover text-decoration-none">
      <i class="bi bi-arrow-left me-1"></i> Back to Sign In
    </a>
  </div>
</form>
