<div class="stoosh-transaction-row">
  <div class="d-flex align-items-center gap-3 flex-grow-1">
    <div class="stoosh-transaction-icon" [class.income]="item.type === 'income'" [class.expense]="item.type === 'expense'">
      @if (item.type === 'income') {
        <i class="bi bi-arrow-up-circle-fill"></i>
      } @else {
        <i class="bi bi-arrow-down-circle-fill"></i>
      }
    </div>
    
    <div class="stoosh-transaction-details">
      <p class="stoosh-transaction-name mb-0">{{ item.name }}</p>
      <small class="stoosh-transaction-date">{{ item.date | date:'mediumDate' }}</small>
    </div>
  </div>
  
  <span class="stoosh-transaction-amount me-3" [class.income]="item.type === 'income'" [class.expense]="item.type === 'expense'">
    {{ item.type === 'income' ? '+' : '-' }}{{ item.amount | currency:'USD':'symbol':'1.0-2' }}
  </span>
  
  <div class="stoosh-transaction-actions">
    @if (!showActions) {
      <button class="stoosh-btn-icon stoosh-btn-dots" (click)="toggleActions()" title="Actions">
        <i class="bi bi-three-dots-vertical"></i>
      </button>
    } @else {
      <div class="stoosh-actions-visible d-flex gap-2 align-items-center">
        <button class="stoosh-btn-icon" (click)="onEdit($event)" title="Edit">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="stoosh-btn-icon stoosh-btn-icon-danger" (click)="onDelete($event)" title="Delete">
          <i class="bi bi-trash"></i>
        </button>
        <button class="stoosh-btn-icon stoosh-btn-close" (click)="toggleActions()" title="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    }
  </div>
</div>
