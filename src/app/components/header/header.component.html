<header class="stoosh-header">
  <div class="d-flex align-items-center">
    <h1 class="stoosh-header-title mb-0">{{ title }}</h1>
  </div>
  
  <div class="stoosh-header-actions">
    @for (action of actions; track action.action) {
      <button class="stoosh-btn stoosh-btn-{{ action.variant }}" (click)="onActionClick(action.action)">
        <i class="bi {{ action.icon }}"></i>
        {{ action.label }}
      </button>
    }
    
    <!-- Profile Menu -->
    <button class="stoosh-profile-menu" 
         [class.active]="profileMenuOpen" 
         (click)="toggleProfileMenu()"
         [attr.aria-expanded]="profileMenuOpen"
         aria-label="Profile menu">
      <div class="stoosh-profile-avatar">
        <i class="bi bi-person-fill"></i>
      </div>
      <i class="bi bi-chevron-down" *ngIf="!profileMenuOpen"></i>
      <i class="bi bi-chevron-up" *ngIf="profileMenuOpen"></i>
    </button>
  </div>
</header>

<!-- Profile Dropdown (rendered outside header to avoid overflow issues) -->
<button class="stoosh-profile-dropdown-backdrop" 
        [class.active]="profileMenuOpen" 
        (click)="toggleProfileMenu()"
        aria-label="Close profile menu">
  <div class="stoosh-profile-dropdown" 
       [class.active]="profileMenuOpen"
       (click)="$event.stopPropagation()"
       (keydown.escape)="toggleProfileMenu()">
    <div class="stoosh-profile-info">
      <div class="stoosh-profile-name">John Doe</div>
      <div class="stoosh-profile-email">john.doe@example.com</div>
    </div>
    <div class="stoosh-profile-divider"></div>
    <button class="stoosh-profile-item">
      <i class="bi bi-person"></i>
      <span>Profile</span>
    </button>
    <button class="stoosh-profile-item">
      <i class="bi bi-gear"></i>
      <span>Settings</span>
    </button>
    <div class="stoosh-profile-divider"></div>
    <button class="stoosh-profile-item stoosh-profile-item--danger">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </button>
  </div>
</button>
